<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrong-way detector</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--card:#eee}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mut:#999;--card:#222}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;padding:10px}
#box{position:relative;width:100%;background:#000;border-radius:10px;overflow:hidden}
video,canvas{display:block;width:100%}
canvas{position:absolute;top:0;left:0;height:100%;touch-action:none}
button{font-size:15px;padding:11px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;margin:8px 6px 0 0}
button.g{background:var(--card);color:var(--fg)}
button.on{outline:3px solid #facc15}
#st{color:var(--mut);font-size:14px;line-height:1.45}
.r{display:flex;gap:6px;background:var(--card);border-radius:8px;padding:6px;margin-top:8px;align-items:center}
.r img{height:90px;max-width:48%;object-fit:contain;border-radius:4px;cursor:pointer}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9;padding:10px}
#lb.show{display:flex}
#lb img{max-width:100%;max-height:78vh;object-fit:contain}
</style></head><body>
<div id="box"><video id="v" playsinline muted></video><canvas id="c"></canvas></div>
<div>
<button id="go">Start camera</button>
<button id="mDir" class="g">1. Set direction</button>
<button id="mRoad" class="g">2. Set road area</button>
<button id="pz" class="g">Pause</button>
<button id="rs" class="g">Reset</button>
</div>
<p id="st">Tap Start camera. Keep the phone fixed on a stand, facing the road.</p>
<div id="out"></div>
<div id="lb"><img id="lbi" alt=""><div><button id="lbs">Save image</button><button class="g" id="lbc">Close</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const v=document.getElementById('v'),c=document.getElementById('c'),x=c.getContext('2d');
const $=id=>document.getElementById(id);
const st=t=>$('st').textContent=t;
const VEH=new Set(['car','motorcycle','bus','truck']);
const HIST=6;
let model=null,running=false,paused=false,busy=false,lastRun=0,started=false;
let mode='dir',allowed=null,road=[],drag=null,dragPt=-1,tracks=[],nid=1,total=0;

$('go').onclick=async()=>{
  if(started)return;
  started=true;
  try{
    st('Starting camera…');
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});
    v.srcObject=s;await v.play();
    c.width=v.videoWidth;c.height=v.videoHeight;
    requestAnimationFrame(loop);
    if(typeof cocoSsd==='undefined'){st('Could not load the detector. Check your internet connection and reload.');return;}
    st('Loading the vehicle detector… the first time takes 10–20 seconds.');
    model=await cocoSsd.load({base:'lite_mobilenet_v2'});
    running=true;
    setMode('dir');
  }catch(e){started=false;st('Camera problem: '+(e&&e.message?e.message:e));}
};

function setMode(m){
  mode=m;
  $('mDir').classList.toggle('on',m==='dir');
  $('mRoad').classList.toggle('on',m==='road');
  st(m==='dir'
    ?'Step 1: drag your finger on the video along the CORRECT traffic direction.'
    :'Step 2: tap 4 corners around the road lanes (e.g. near-left, near-right, far-right, far-left). Drag a dot to adjust. Anything outside is ignored.');
}
$('mDir').onclick=()=>setMode('dir');
$('mRoad').onclick=()=>setMode('road');
$('pz').onclick=()=>{paused=!paused;$('pz').textContent=paused?'Resume':'Pause';st(paused?'Paused.':'Watching for wrong-way vehicles.');};
$('rs').onclick=()=>{allowed=null;road=[];tracks=[];drag=null;setMode('dir');};

function pos(e){const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height];}
function roadStatus(){
  if(road.length<4)st('Road area: tap corner '+(road.length+1)+' of 4.');
  else st('Road area set. Drag a numbered dot to adjust it. Watching for wrong-way vehicles.');
}
c.onpointerdown=e=>{
  const p=pos(e);
  if(mode==='road'){
    const R=c.width*0.05;dragPt=-1;
    for(let i=0;i<road.length;i++)if(Math.hypot(road[i][0]-p[0],road[i][1]-p[1])<R){dragPt=i;break;}
    if(dragPt<0){
      if(road.length>=4)road=[];
      road.push(p);dragPt=road.length-1;roadStatus();
    }
    return;
  }
  drag={a:p,b:p};
};
c.onpointermove=e=>{
  if(mode==='road'){if(dragPt>=0)road[dragPt]=pos(e);return;}
  if(drag)drag.b=pos(e);
};
c.onpointerup=()=>{
  if(mode==='road'){dragPt=-1;return;}
  if(!drag)return;
  const[ax,ay]=drag.a,[bx,by]=drag.b;
  const dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy);
  if(d>30){allowed={a:drag.a,b:drag.b,ux:dx/d,uy:dy/d};setMode('road');}
  drag=null;
};

async function loop(t){
  requestAnimationFrame(loop);
  draw();
  if(!running||paused||busy||t-lastRun<150)return;
  busy=true;lastRun=t;
  try{update(await model.detect(v,20,0.4));}catch(e){}
  busy=false;
}

function inRoad(px,py){
  if(road.length<4)return true;
  let inside=false;
  for(let i=0,j=3;i<4;j=i++){
    const xi=road[i][0],yi=road[i][1],xj=road[j][0],yj=road[j][1];
    if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)inside=!inside;
  }
  return inside;
}

function update(preds){
  const minArea=c.width*c.height*0.0008;
  const dets=[];
  for(const p of preds){
    if(!VEH.has(p.class))continue;
    const[bx,by,bw,bh]=p.bbox;
    if(bw*bh<minArea)continue;
    const cx=bx+bw/2,cy=by+bh/2;
    if(!inRoad(cx,cy))continue;
    dets.push({x:bx,y:by,w:bw,h:bh,cx,cy,cls:p.class});
  }
  for(const t of tracks)t.hit=false;
  const maxd=c.width*0.15;
  for(const d of dets){
    let best=null,bd=maxd;
    for(const t of tracks){
      if(t.hit)continue;
      const dd=Math.hypot(t.cx-d.cx,t.cy-d.cy);
      if(dd<bd){bd=dd;best=t;}
    }
    if(!best){best={id:nid++,hist:[],missed:0,flagged:false,bad:0};tracks.push(best);}
    best.hit=true;best.missed=0;best.box=d;best.cx=d.cx;best.cy=d.cy;
    best.hist.push([d.cx,d.cy]);if(best.hist.length>HIST)best.hist.shift();
    if(best.hist.length>=HIST){
      const f0=best.hist[0],l0=best.hist[best.hist.length-1];
      best.moving=Math.hypot(l0[0]-f0[0],l0[1]-f0[1])>Math.max(c.width*0.02,d.w*0.15);
    }
    if(allowed&&!best.flagged&&best.hist.length>=HIST){
      const f=best.hist[0],l=best.hist[best.hist.length-1];
      const mx=l[0]-f[0],my=l[1]-f[1],md=Math.hypot(mx,my);
      if(md>c.width*0.05&&(mx*allowed.ux+my*allowed.uy)/md<-0.6)best.bad++;else best.bad=0;
      if(best.bad>=2){best.flagged=true;capture(best);}
    }
  }
  for(const t of tracks)if(!t.hit)t.missed++;
  tracks=tracks.filter(t=>t.missed<=6);
}

function draw(){
  x.clearRect(0,0,c.width,c.height);
  const lw=Math.max(2,c.width/400),fs=Math.round(c.width/38);
  x.lineWidth=lw;x.font='bold '+fs+'px sans-serif';
  drawRoad();x.lineWidth=lw;x.font='bold '+fs+'px sans-serif';
  for(const t of tracks){
    if(!t.hit||(!t.moving&&!t.flagged))continue;
    const b=t.box;
    x.strokeStyle=t.flagged?'#ef4444':'#22c55e';
    x.strokeRect(b.x,b.y,b.w,b.h);
    if(t.flagged){x.fillStyle='#ef4444';x.fillText('WRONG WAY',b.x,Math.max(fs,b.y-6));}
  }
  if(allowed){arrow(allowed.a,allowed.b);}
  if(drag&&mode==='dir')arrow(drag.a,drag.b);
}

function drawRoad(){
  if(!road.length)return;
  x.lineWidth=Math.max(2,c.width/400);
  x.strokeStyle='#22d3ee';x.fillStyle='rgba(34,211,238,.15)';
  x.setLineDash([12,8]);
  x.beginPath();x.moveTo(road[0][0],road[0][1]);
  for(let i=1;i<road.length;i++)x.lineTo(road[i][0],road[i][1]);
  if(road.length===4){x.closePath();x.fill();}
  x.stroke();x.setLineDash([]);
  road.forEach((p,i)=>{
    x.fillStyle='#22d3ee';x.beginPath();x.arc(p[0],p[1],c.width/90,0,7);x.fill();
    x.fillStyle='#000';x.font='bold '+Math.round(c.width/50)+'px sans-serif';
    x.fillText(i+1,p[0]-c.width/200,p[1]+c.width/160);
  });
}

function arrow(a,b){
  const[ax,ay]=a,[bx,by]=b,h=c.width/30;
  x.strokeStyle='#facc15';x.fillStyle='#facc15';x.lineWidth=Math.max(4,c.width/250);
  x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke();
  const ang=Math.atan2(by-ay,bx-ax);
  x.beginPath();x.moveTo(bx,by);
  x.lineTo(bx-h*Math.cos(ang-.4),by-h*Math.sin(ang-.4));
  x.lineTo(bx-h*Math.cos(ang+.4),by-h*Math.sin(ang+.4));x.fill();
}

function capture(t){
  const b=t.box,W=v.videoWidth,H=v.videoHeight;
  const f=document.createElement('canvas');f.width=W;f.height=H;
  const fx=f.getContext('2d');fx.drawImage(v,0,0);
  const px=b.w*0.15,py=b.h*0.15;
  const sx0=Math.max(0,b.x-px),sy0=Math.max(0,b.y-py);
  const sw=Math.min(W-sx0,b.w+2*px),sh=Math.min(H-sy0,b.h+2*py);
  const cr=document.createElement('canvas');cr.width=sw;cr.height=sh;
  cr.getContext('2d').drawImage(f,sx0,sy0,sw,sh,0,0,sw,sh);
  const now=new Date();
  fx.strokeStyle='#ef4444';fx.lineWidth=Math.max(3,W/300);
  fx.strokeRect(b.x,b.y,b.w,b.h);
  fx.fillStyle='#fff';fx.font='bold '+Math.round(W/38)+'px sans-serif';
  fx.shadowColor='#000';fx.shadowBlur=4;
  fx.fillText(now.toLocaleString(),12,Math.round(W/30));
  total++;
  const r=document.createElement('div');r.className='r';
  const stamp=now.toISOString().replace(/[:.]/g,'-').slice(0,19);
  const i1=document.createElement('img');i1.src=f.toDataURL('image/jpeg',.9);i1.dataset.name='wrongway_'+stamp+'_'+total+'_full.jpg';
  const i2=document.createElement('img');i2.src=cr.toDataURL('image/jpeg',.92);i2.dataset.name='wrongway_'+stamp+'_'+total+'_car.jpg';
  const sp=document.createElement('span');sp.innerHTML='#'+total+' '+b.cls+'<br>'+now.toLocaleTimeString()+'<br><small>Tap a photo to enlarge and save</small>';
  r.append(i1,i2,sp);
  const out=$('out');out.prepend(r);
  while(out.children.length>40)out.removeChild(out.lastChild);
  if(navigator.vibrate)navigator.vibrate(200);
  st('Wrong-way vehicles captured: '+total+'. Press and hold an image to save it.');
}

let lbName='wrongway.jpg';
$('out').onclick=e=>{
  if(e.target.tagName!=='IMG')return;
  $('lbi').src=e.target.src;lbName=e.target.dataset.name||'wrongway.jpg';
  $('lb').classList.add('show');
};
$('lbc').onclick=()=>$('lb').classList.remove('show');
$('lbs').onclick=async()=>{
  try{
    const b=await (await fetch($('lbi').src)).blob();
    const u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=lbName;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),5000);
  }catch(e){st('Could not save automatically. Press and hold the enlarged photo and choose Download image.');}
};
</script></body></html>
